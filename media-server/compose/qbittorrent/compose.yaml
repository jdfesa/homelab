name: media-qbittorrent

services:
  qbittorrent:
    image: ${QBITTORRENT_IMAGE:?Set the reviewed LinuxServer image digest}
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      PUID: "1000"
      PGID: "2000"
      UMASK: "002"
      TZ: America/Argentina/Buenos_Aires
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    ports:
      - target: 8080
        published: "8080"
        host_ip: ${QBITTORRENT_BIND_ADDRESS:?Set the private VM LAN IPv4}
        protocol: tcp
    volumes:
      - type: bind
        source: /srv/media-server/appdata/qbittorrent
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: /data/downloads
        target: /data/downloads
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, http://127.0.0.1:8080/]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    # s6 initializes as root, then runs qBittorrent with PUID/PGID above.
    # No peer port published initially: passive mode, no router/NAT changes.
    # No Docker socket, media library mount or privileged mode.
