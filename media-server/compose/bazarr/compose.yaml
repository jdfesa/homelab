name: media-bazarr

services:
  bazarr:
    image: ${BAZARR_IMAGE:?Set the reviewed LinuxServer immutable image digest}
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      PUID: "1000"
      PGID: "2000"
      UMASK: "002"
      TZ: America/Argentina/Buenos_Aires
    ports:
      - target: 6767
        published: "6767"
        host_ip: ${BAZARR_BIND_ADDRESS:?Set the private VM LAN IPv4}
        protocol: tcp
    volumes:
      - type: bind
        source: /srv/media-server/appdata/bazarr
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: /data/media
        target: /data/media
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, http://127.0.0.1:6767/api/system/ping]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    # s6 initializes as root; Bazarr runs as PUID/PGID.
    # Only the library is writable: no downloads, Docker socket or devices.
    # Forms auth is seeded before first start; providers initially disabled.
