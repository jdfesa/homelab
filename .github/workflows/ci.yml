name: Repository CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check publication boundaries
        # Acknowledge only the existing canonical lab example, not other secrets.
        run: python3 scripts/check-publication.py --acknowledge-public-lab-password

      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks.XXXXXX")"
          trap 'rm -rf -- "$tool_dir"' EXIT
          archive="$tool_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          "$tool_dir/gitleaks" git . --redact=100 --no-banner --no-color \
            --ignore-gitleaks-allow --log-opts=--all --timeout=300

      - name: Run local repository and workload tests
        run: sh scripts/run-tests.sh
